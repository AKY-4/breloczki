# typ: wizualizacja (grafika projektu) albo zdjecie (prawdziwe zdjęcie; wypełnia kafel w całości).
galeria:
  - { plik: "brelok-dla-silowni", podpis: "Brelok dla siłowni", firma: "Best Gym", produkt: "brelok", typ: "wizualizacja", tlo: "#d9d9d9", w: 640, h: 640, zgoda: false,
      alt: "Brelok 3D w kształcie hantla z logo siłowni, żółto-czarny" }
  - { plik: "brelok-dla-kawiarni", podpis: "Brelok dla kawiarni", firma: "Krówka i Kawka", produkt: "brelok", typ: "wizualizacja", tlo: "#d9d9d9", w: 640, h: 640, zgoda: false,
      alt: "Brelok 3D w kształcie krowy z logo kawiarni, brązowo-biały" }
  - { plik: "brelok-dla-pizzerii", podpis: "Brelok dla pizzerii", firma: "Pizzagram", produkt: "brelok", typ: "wizualizacja", tlo: "#d9d9d9", w: 640, h: 640, zgoda: false,
      alt: "Okrągły brelok 3D z logo pizzerii w trzech kolorach: czarnym, białym i żółtym" }
  - { plik: "brelok-dla-barbera", podpis: "Brelok dla barbera", firma: "Żyleta Barber", produkt: "brelok", typ: "wizualizacja", tlo: "#d9d9d9", w: 640, h: 640, zgoda: false,
      alt: "Brelok 3D w kształcie żyletki z logo barbera, biało-czarny" }
  - { plik: "brelok-dla-salonu-kosmetycznego", podpis: "Brelok dla salonu kosmetycznego", firma: "Hello Beauty", produkt: "brelok", typ: "wizualizacja", tlo: "#d9d9d9", w: 640, h: 252, zgoda: false,
      alt: "Podłużny kremowy brelok 3D z logo salonu kosmetycznego" }
  - { plik: "brelok-dla-firmy-motoryzacyjnej", podpis: "Brelok dla firmy motoryzacyjnej", firma: "WGM Motors", produkt: "brelok", typ: "wizualizacja", tlo: "#d9d9d9", w: 640, h: 185, zgoda: false,
      alt: "Podłużny biały brelok 3D z logo firmy motoryzacyjnej i czerwoną ramką" }
  - { plik: "tabliczka-nfc-dla-kawiarni", podpis: "Tabliczka NFC dla kawiarni", firma: "Krówka i Kawka", produkt: "tabliczka", typ: "wizualizacja", tlo: "#e6e4e1", w: 640, h: 640, zgoda: false,
      alt: "Kremowa tabliczka NFC do opinii Google z logo kawiarni na brązowej podstawce" }
  - { plik: "tabliczka-nfc-dla-pizzerii", podpis: "Tabliczka NFC dla pizzerii", firma: "Pizzagram", produkt: "tabliczka", typ: "wizualizacja", tlo: "#e6e4e1", w: 640, h: 640, zgoda: false,
      alt: "Czarna tabliczka NFC do opinii Google z logo pizzerii na żółtej podstawce" }

# LISTA STRON. Nową podstronę (np. o tabliczkach NFC) dodaje się tutaj i jako szablon w szablony/.
strony:
  - { szablon: "index", sciezka: "/", w_mapie: true, indeksowana: true }
  - { szablon: "polityka", sciezka: "/polityka-prywatnosci/", w_mapie: false, indeksowana: true,
      tytul: "Polityka prywatności | 3D things", opis: "Jak 3D things przetwarza dane z formularza kontaktowego: administrator, cele, okres przechowywania i prawa osób." }
  - { szablon: "dziekujemy", sciezka: "/dziekujemy/", w_mapie: false, indeksowana: false,
      tytul: "Dziękuję za zapytanie | 3D things", opis: "Zapytanie zostało wysłane." }
  - { szablon: "404", sciezka: "/404.html", w_mapie: false, indeksowana: false,
      tytul: "Nie ma takiej strony | 3D things", opis: "Strona, której szukasz, nie istnieje." }

# UKŁAD STRONY
uklad:
  pokaz_blok_brelokow: true   # blok „Breloki 3D z logo firmy na zamówienie" z tabelą parametrów, teraz na końcu strony.
                              # Zmień na false, żeby go usunąć ze strony.

# NAGRANIE Z DRUKU w sekcji „Jak powstają breloki”. Puste pole plik = nagranie się nie pojawia.
nagranie:
  plik: "druk-3d-brelokow.mp4"       # plik w zasoby/wideo/
  plakat: "druk-3d-brelokow.jpg"     # kadr pokazywany, zanim nagranie ruszy
  tytul: "Tak wygląda druk naprawdę"
  opis: "Na jednej płycie drukarki powstaje kilkanaście breloków naraz. Głowica nakłada kolejne warstwy tworzywa, aż każdy brelok osiągnie pełną grubość."
  etykieta: "Nagranie: drukarka 3D drukuje serię żółto-czarnych breloków na jednej płycie"
  data: "2026-11-19"
  czas_s: 5

# OBRACANE BRELOKI w sekcji „Przykładowe projekty”.
# Pięć breloków w kształcie logo (byk, krowa, diament, Magic Stick, pizza) powstało na wzór logo prawdziwych firm.
# Do wersji do publikacji trafiają dopiero po zgodzie tych firm.
breloki_3d:
  zgoda_ksztalt_logo: false   # true = firmy się zgodziły, zestaw „Kształt logo” pojawia się także po publikacji
