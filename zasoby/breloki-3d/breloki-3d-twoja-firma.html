:root{--tlo:#efe7fb;--podloga:#d9c9f5;--tekst2:#5d5868}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--tlo);font-family:"Jost",Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}
body.przezroczyste{background:transparent}
.scena{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:16px 4vw;padding:32px 16px;width:100%}
.miejsce{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;perspective:900px;position:relative}
.miejsce figcaption{font-weight:600;color:var(--tekst2);font-size:15px;letter-spacing:.02em}
.miejsce::after{content:"";position:absolute;bottom:30px;width:56%;height:14px;border-radius:50%;background:var(--podloga);z-index:0;transition:transform .3s,opacity .3s}
.miejsce:hover::after{transform:scale(.85);opacity:.7}
.bez-podpisow .miejsce figcaption{display:none}.bez-podpisow .miejsce::after{bottom:-8px}
.b{position:relative;z-index:1;width:var(--w);margin-bottom:22px;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none;outline-offset:10px;transition:translate .3s}
.b:hover{translate:0 -8px}
.b:active{cursor:grabbing}
.b--med{--w:min(19vw,210px);aspect-ratio:200/240;--dz:calc(var(--w)/120);--kr:30%}
.b--pod{--w:min(30vw,340px);aspect-ratio:320/110;--dz:calc(var(--w)/186);--kr:17%}
.b--pro{--w:min(17vw,195px);aspect-ratio:220/240;--dz:calc(var(--w)/132);--kr:30%}
.tylko .b--med{--w:min(70vw,52vh)}.tylko .b--pod{--w:min(88vw,620px)}.tylko .b--pro{--w:min(66vw,48vh)}
.obr{position:absolute;inset:0;transform-style:preserve-3d}
.w,.n{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(calc(var(--i)*var(--dz)))}
.w{fill:var(--pb)}.w.gora{fill:var(--p);filter:brightness(var(--sw,1))}
.n{fill:var(--nb);font-weight:600;letter-spacing:.06em}.n.gora{fill:var(--n);filter:brightness(var(--sw,1))}
.kolko{position:absolute;left:50%;top:11.7%;width:var(--kr);aspect-ratio:1;border:calc(var(--w)*.022) solid #b7b6c0;border-radius:50%;transform-origin:50% 100%;transform:translate(-50%,-100%) translateZ(calc(6*var(--dz))) rotateY(66deg)}
.b--pro .kolko{top:14.2%;transform:translate(-50%,-100%) translateZ(calc(6*var(--dz))) rotateY(-50deg)}
.b--pod .kolko{left:15.6%;top:50%;transform-origin:100% 50%;transform:translate(-100%,-50%) translateZ(calc(6*var(--dz))) rotateX(66deg)}
[data-k="0"]{--p:#26242d;--pb:#141318;--n:#a274ea;--nb:#6c40b4}
[data-k="1"]{--p:#f7f5f1;--pb:#cdc7be;--n:#1d1b22;--nb:#050506}
[data-k="2"]{--p:#43d1a6;--pb:#2a9a79;--n:#fff;--nb:#c9d6d1}
[data-k="3"]{--p:#ff8a3d;--pb:#c45d19;--n:#1d1b22;--nb:#050506}
[data-k="4"]{--p:#ff6fa8;--pb:#c9467b;--n:#fff;--nb:#e6d3db}
.rzad{flex-basis:100%;text-align:center;margin:8px 0 -4px;font-weight:600;color:var(--tekst2);font-size:17px;letter-spacing:.04em}
.bez-podpisow .rzad{visibility:hidden}
.miejsce[data-zestaw="ksztalt"]::after{bottom:-8px}
.lamanie{flex-basis:100%;height:0}
.grupa{display:flex;flex-direction:column;align-items:center;background:#e2d5f7;border-radius:32px;padding:16px 3vw 26px}
.grupa__tytul{margin:0 0 30px;font-weight:600;color:var(--tekst2);font-size:16px;letter-spacing:.05em}
.trojkat{display:grid;grid-template-columns:repeat(6,auto);gap:0 1.3vw;justify-items:center;align-items:end}
.trojkat>*{grid-column:span 2}.trojkat>:nth-child(-n+2){grid-column:span 3;margin-bottom:-6px}
.trojkat>:nth-child(-n+2)::after{display:none}
.tylko .grupa{background:none;padding:0}.tylko .grupa__tytul{display:none}
.b--ksztalt{--dz:calc(var(--w) * .25 / var(--vbw));--kr:22%}
.b--byk{--w:min(17vw,195px)}.b--krowa{--w:min(16vw,185px)}.b--diament{--w:min(12.5vw,140px)}.b--pizza{--w:min(12vw,134px)}.b--magicstick{--w:min(10.5vw,118px)}
.tylko .b--byk{--w:min(86vw,560px)}.tylko .b--krowa{--w:min(86vw,560px)}.tylko .b--diament{--w:min(66vw,46vh)}.tylko .b--pizza{--w:min(62vw,44vh)}.tylko .b--magicstick{--w:min(58vw,46vh)}
.l{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(calc(var(--i)*var(--dz)));fill:var(--f)}.l.gora{filter:brightness(var(--sw,1))}
.b--ksztalt .kolko{left:var(--ox);top:var(--oy)}
.b--krowa .kolko,.b--magicstick .kolko,.b--diament .kolko{transform:translate(-50%,-100%) translateZ(calc(6*var(--dz))) rotateY(-50deg)}
.defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:760px){.b--byk{--w:44vw}.b--krowa{--w:42vw}.b--diament{--w:29vw}.b--pizza{--w:28vw}.b--magicstick{--w:25vw}.b--med{--w:40vw}.b--pod{--w:86vw}.b--pro{--w:38vw}}
@media (prefers-reduced-motion:reduce){.b,.miejsce::after{transition:none}}
/* strona 3D things: modele zmniejszone o ok. 18% względem oryginału (wartości --w poniżej nadpisują te wyżej) */
.b--med{--w:min(16vw,172px)}.b--pod{--w:min(25vw,280px)}.b--pro{--w:min(14vw,160px)}
.b--byk{--w:min(14vw,160px)}.b--krowa{--w:min(13vw,152px)}.b--diament{--w:min(10.3vw,115px)}.b--pizza{--w:min(9.8vw,110px)}.b--magicstick{--w:min(8.6vw,97px)}
.scena{padding:20px 16px}
@media (max-width:760px){.b--byk{--w:37vw}.b--krowa{--w:35vw}.b--diament{--w:24vw}.b--pizza{--w:23vw}.b--magicstick{--w:21vw}.b--med{--w:34vw}.b--pod{--w:72vw}.b--pro{--w:32vw}}
</style>

  var zestaw = q.get("zestaw");
  [].slice.call(scena.querySelectorAll("[data-zestaw]")).forEach(function (el) {
    if ((zestaw && el.getAttribute("data-zestaw") !== zestaw) || (tylko && el.classList.contains("rzad"))) el.parentNode.removeChild(el);
  });

  /* breloki są już w pliku (działają też bez skryptu); skrypt tylko je ożywia */
  var b3d = [];
  [].slice.call(scena.querySelectorAll(".b")).forEach(function (el, i) {

  });

  /* napis dopasowany do szerokości; dłuższy dzielony na dwie linijki */

  function wpisz(klucz, t, max, fs) {
    var el = document.querySelector('[data-t="' + klucz + '"]');

    var w = miara.getComputedTextLength() * fs / 30 || 1;
    el.textContent = t;

  }

    var s = t.split(/\s+/), naj = [t, ""], roz = 1e9;

      var a = s.slice(0, i).join(" "), b = s.slice(i).join(" "), d = Math.abs(a.length - b.length);
      if (d < roz) { roz = d; naj = [a, b]; }
    }
    return naj;
  }

    if (e.origin !== location.origin || !e.data || typeof e.data.napis !== "string") return;

  });

  /* obracanie: przeciąganie z rozpędem, strzałki, kliknięcie = szybki obrót, samo kołysanie po 2,5 s spokoju */
  var teraz = function () { return performance.now(); };
  b3d.forEach(function (b) {
    var px = 0, py = 0, droga = 0;

      if (b.ciag && droga < 6 && !spokoj) b.obrot = 360; // kliknięcie: pełny obrót

    };
    b.el.addEventListener("pointerup", pusc);
    b.el.addEventListener("pointercancel", pusc);

      var o = { ArrowLeft: -20, ArrowRight: 20 }[e.key];

    });
  });

    var t = teraz();
    b3d.forEach(function (b) {
